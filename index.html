<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小区路网打点生成器（高德版，含定位修复） - pmea</title>

  <!-- 高德 Web API v2.0：Key 已填 -->
  <script src="https://webapi.amap.com/maps?v=2.0&key=d08b062133f21fe1bdf7de55d110fc14"></script>

  <style>
    :root{ --bg:#f5f7fb; --panel:#ffffff; --primary:#2f7cf6; --danger:#e24646; --text:#1d2533; --muted:#697383; --line:#dfe7f4; }
    *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
    body{display:flex;flex-direction:column}
    .topbar{display:flex;align-items:center;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line);gap:8px;flex-wrap:wrap}
    .group{display:flex;gap:8px;flex-wrap:wrap}
    button,select,input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:white;font-size:14px}
    button{cursor:pointer;transition:.15s ease}
    button:hover{transform:translateY(-1px);box-shadow:0 2px 6px rgba(0,0,0,.05)}
    .primary{background:var(--primary);color:#fff;border-color:var(--primary)}
    .danger{background:var(--danger);color:#fff;border-color:var(--danger)}
    .panel{padding:12px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
    .panel .inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    #map{flex:1;min-height:420px}
    .badge{display:inline-block;font-size:12px;color:var(--muted);padding:4px 8px;border-radius:999px;background:#eef4ff;border:1px solid #dfeaff}
    .footer-mini{font-size:12px;color:var(--muted);padding:8px 12px;border-top:1px solid var(--line);background:white}
    @media(max-width:700px){.topbar,.panel{padding:8px}.node-list{width:100%}}
    .amap-info-item{font-size:13px;color:#333}
    .diag { position: absolute; right: 12px; top: 84px; background: rgba(255,255,255,0.95); border: 1px solid #e6eefc; padding: 8px; border-radius: 8px; font-size:12px; color:#333; max-width:220px; z-index:999; }
    .diag b { display:block; margin-bottom:6px; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="group">
      <select id="nodeType">
        <option value="entrance">入口</option>
        <option value="junction" selected>路口/转角</option>
        <option value="turn">拐弯</option>
        <option value="house">门牌点</option>
      </select>
      <button id="addModeBtn" class="primary">添加节点</button>
      <button id="connectModeBtn">连线</button>
      <button id="locateBtn">定位并添加节点</button>
    </div>
    <div class="group">
      <button id="saveBtn">保存</button>
      <button id="exportBtn" class="primary">导出 JSON</button>
      <button id="importBtn">导入 JSON</button>
      <input id="importInput" type="file" accept=".json" style="display:none" />
      <button id="resetBtn" class="danger">清空</button>
    </div>
  </div>

  <div class="panel">
    <div class="inline">
      <label for="houseNo">门牌号</label>
      <input id="houseNo" type="text" placeholder="如：12号、A栋12号" />
      <button id="attachHouseBtn">绑定门牌到当前点</button>
    </div>

    <div class="inline">
      <label for="nodeName">节点名</label>
      <input id="nodeName" type="text" placeholder="如：入口A、转角1" />
      <button id="renameNodeBtn">保存节点名</button>
    </div>

    <div class="inline">
      <label for="imageInput">补充图片</label>
      <input id="imageInput" type="file" accept="image/*" />
      <button id="deleteNodeBtn" class="danger">删除当前点</button>
    </div>
  </div>

  <div id="map"></div>

  <div class="diag" id="diag" style="display:none">
    <b>定位诊断</b>
    <div id="diagText">等待定位...</div>
  </div>

  <div class="footer-mini">
    <span class="badge" id="statsBadge">0 个节点 / 0 条边</span>
    说明：当前模式决定点击地图时的行为。添加节点后可切到“连线”模式，点击两个节点自动生成边。
  </div>

  <script>
    // ---------- 配置 ----------
    const STORAGE_KEY = 'community_path_editor_state_amap_loc_v2';
    const defaultCenter = [121.4737, 31.2304]; // [lng, lat]

    // 初始化地图
    const map = new AMap.Map('map', { zoom: 17, center: defaultCenter, viewMode: '2D' });

    // ---------- 状态 ----------
    const state = { nodes: [], edges: [], houses: [], selectedNodeId: null, mode: 'add', firstConnectNodeId: null };

    // UI 元素
    const nodeTypeEl = document.getElementById('nodeType');
    const houseNoEl = document.getElementById('houseNo');
    const nodeNameEl = document.getElementById('nodeName');
    const statsBadgeEl = document.getElementById('statsBadge');
    const imageInputEl = document.getElementById('imageInput');
    const locateBtn = document.getElementById('locateBtn');
    const diagEl = document.getElementById('diag');
    const diagText = document.getElementById('diagText');

    let currentLocationMarker = null;
    let currentLocationCircle = null;

    // 工具函数
    function uid(prefix='id'){ return `${prefix}_${Date.now()}_${Math.random().toString(16).slice(2,9)}`; }
    function haversineKm(lat1, lon1, lat2, lon2){ const R=6371; const dLat=(lat2-lat1)*Math.PI/180; const dLon=(lon2-lon1)*Math.PI/180; const a=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2); const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); return R*c*1000; }

    // 本地存储
    function loadState(){ const raw = localStorage.getItem(STORAGE_KEY); if(raw){ try{ const data = JSON.parse(raw); state.nodes = Array.isArray(data.nodes)?data.nodes:[]; state.edges = Array.isArray(data.edges)?data.edges:[]; state.houses = Array.isArray(data.houses)?data.houses:[]; state.selectedNodeId = data.selectedNodeId||null; state.mode = data.mode||'add'; }catch(e){ console.warn('加载本地数据失败', e); } } }
    function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify({nodes:state.nodes, edges:state.edges, houses:state.houses, selectedNodeId:state.selectedNodeId, mode:state.mode})); }

    // 地图对象清理/绘制
    function getNodeById(id){ return state.nodes.find(n=>n.id===id)||null; }
    function setSelectedNode(nodeId){ state.selectedNodeId = nodeId; const node = getNodeById(nodeId); if(!node) return; houseNoEl.value = node.house_no||''; nodeNameEl.value = node.name||''; renderAll(); saveState(); }
    function getNodeColor(type){ if(type==='entrance') return '#22a06b'; if(type==='turn') return '#f59e0b'; if(type==='house') return '#ef5b9d'; return '#4f7cff'; }

    function clearMapObjects(){ state.nodes.forEach(n => { if(n._marker){ n._marker.setMap(null); n._marker = null; } }); state.edges.forEach(e => { if(e._polyline){ e._polyline.setMap(null); e._polyline = null; } }); }

    function drawEdges(){ state.edges.forEach(edge => { const a = getNodeById(edge.from), b = getNodeById(edge.to); if(!a||!b) return; const path = [[a.lng,a.lat],[b.lng,b.lat]]; const polyline = new AMap.Polyline({ path, showDir:false, strokeWeight:4, strokeColor:'#3b82f6', strokeOpacity:0.9 }); polyline.setMap(map); edge._polyline = polyline; polyline.on('click', () => { const mid = [(a.lng+b.lng)/2, (a.lat+b.lat)/2]; const info = new AMap.InfoWindow({ content:`<div class="amap-info-item">长度约 ${Math.round(edge.length_m)} 米</div>`, offset: new AMap.Pixel(0,-10) }); info.open(map, mid); }); }); }

    function drawNodes(){ state.nodes.forEach(node => { if(node._marker){ node._marker.setMap(null); node._marker = null; } const color = getNodeColor(node.type); const html = `<div style="width:18px;height:18px;border-radius:50%;background:${color};border:2px solid #fff;box-shadow:0 1px 2px rgba(0,0,0,0.15)" title="${node.name||node.type}"></div>`; const marker = new AMap.Marker({ position: [node.lng, node.lat], content: html, anchor: 'center' }); marker.setMap(map); marker.on('click', () => { setSelectedNode(node.id); const info = new AMap.InfoWindow({ content:`<div style="min-width:160px"><b>${node.name||node.type}</b><br>类型：${node.type}<br>坐标：${node.lat.toFixed(6)}, ${node.lng.toFixed(6)}<br>图片：${(node.images||[]).length} 张</div>`, offset: new AMap.Pixel(0,-10) }); info.open(map, [node.lng, node.lat]); }); node._marker = marker; }); }

    function updateStats(){ statsBadgeEl.textContent = `${state.nodes.length} 个节点 / ${state.edges.length} 条边`; }
    function renderAll(){ clearMapObjects(); drawEdges(); drawNodes(); updateStats(); highlightSelectedNode(); renderInspector(); }
    function highlightSelectedNode(){ const node = getNodeById(state.selectedNodeId); if(!node) return; map.setCenter([node.lng, node.lat]); }
    function renderInspector(){ const node = getNodeById(state.selectedNodeId); if(!node){ houseNoEl.value=''; nodeNameEl.value=''; return; } houseNoEl.value=node.house_no||''; nodeNameEl.value=node.name||''; }

    // 编辑操作
    function addNode(lat, lng, type=nodeTypeEl.value, name=''){ const node = { id:uid('node'), type, lat, lng, name: name||`${type==='house'?'门牌点':'节点'}-${state.nodes.length+1}`, images: [], house_no:'' }; state.nodes.push(node); setSelectedNode(node.id); saveState(); renderAll(); }
    function addEdge(fromNodeId, toNodeId){ if(!fromNodeId||!toNodeId||fromNodeId===toNodeId) return; const exists = state.edges.some(e => (e.from===fromNodeId&&e.to===toNodeId)||(e.from===toNodeId&&e.to===fromNodeId)); if(exists) return; const a=getNodeById(fromNodeId), b=getNodeById(toNodeId); const length_m = haversineKm(a.lat,a.lng,b.lat,b.lng); const edge = { id:uid('edge'), from:fromNodeId, to:toNodeId, length_m, images:[] }; state.edges.push(edge); saveState(); renderAll(); }
    function deleteSelectedNode(){ if(!state.selectedNodeId) return; const id=state.selectedNodeId; state.nodes = state.nodes.filter(n=>n.id!==id); state.edges = state.edges.filter(e=>e.from!==id&&e.to!==id); state.houses = state.houses.filter(h=>h.nodeId!==id); state.selectedNodeId = state.nodes[0]?.id || null; saveState(); renderAll(); }
    function attachHouseToSelectedNode(){ const node = getNodeById(state.selectedNodeId); if(!node){ alert('请先选中一个节点'); return; } const houseNo = houseNoEl.value.trim(); if(!houseNo){ alert('请输入门牌号'); return; } node.house_no = houseNo; node.name = node.name || houseNo; state.houses = state.houses.filter(h=>h.nodeId!==node.id); state.houses.push({ id: uid('house'), nodeId: node.id, house_no: houseNo }); saveState(); renderAll(); }
    function renameSelectedNode(){ const node = getNodeById(state.selectedNodeId); if(!node){ alert('请先选中节点'); return; } const name = nodeNameEl.value.trim(); if(!name){ alert('请输入节点名称'); return; } node.name = name; saveState(); renderAll(); }
    function readAsDataURL(file){ return new Promise((resolve,reject)=>{ const reader=new FileReader(); reader.onload=()=>resolve(reader.result); reader.onerror=reject; reader.readAsDataURL(file); }); }
    async function attachImageToSelectedNode(){ const node = getNodeById(state.selectedNodeId); if(!node){ alert('请先选中节点'); return; } const file = imageInputEl.files[0]; if(!file){ alert('请选择图片文件'); return; } const dataUrl = await readAsDataURL(file); const caption = prompt('请输入图片说明（可为空）','关键路口/拐弯图片') || '关键位置图片'; node.images = node.images || []; node.images.push({ id: uid('img'), dataUrl, caption, uploadedAt: new Date().toISOString() }); saveState(); renderAll(); alert('图片已保存到当前节点（本地）。'); }
    function exportJson(){ const payload={ version:1, exportedAt:new Date().toISOString(), nodes: state.nodes.map(n=>({ id:n.id, type:n.type, lat:n.lat, lng:n.lng, name:n.name, house_no:n.house_no||'', images:n.images||[] })), edges: state.edges.map(e=>({ id:e.id, from:e.from, to:e.to, length_m:e.length_m, images:e.images||[] })), houses: state.houses }; const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='community_path_data_amap_loc.json'; a.click(); URL.revokeObjectURL(a.href); }
    function importJson(file){ const reader=new FileReader(); reader.onload=function(e){ try{ const data=JSON.parse(e.target.result); if(!data||!Array.isArray(data.nodes)||!Array.isArray(data.edges)) throw new Error('JSON 格式不正确'); state.nodes = data.nodes.map(n=>({...n, images: Array.isArray(n.images)?n.images:[], house_no: n.house_no||'' })); state.edges = data.edges.map(e=>({...e, images: Array.isArray(e.images)?e.images:[] })); state.houses = Array.isArray(data.houses)?data.houses:[]; state.selectedNodeId = state.nodes[0]?.id || null; saveState(); renderAll(); alert('导入成功'); }catch(err){ alert('导入失败：'+err.message); } }; reader.readAsText(file); }
    function resetAll(){ const ok = confirm('确认清空所有路网数据？'); if(!ok) return; state.nodes=[]; state.edges=[]; state.houses=[]; state.selectedNodeId=null; state.mode='add'; localStorage.removeItem(STORAGE_KEY); renderAll(); }
    function setMode(mode){ state.mode = mode; const addBtn=document.getElementById('addModeBtn'), connectBtn=document.getElementById('connectModeBtn'); if(mode==='add'){ addBtn.classList.add('primary'); connectBtn.classList.remove('primary'); } else { addBtn.classList.remove('primary'); connectBtn.classList.add('primary'); } }

    // 地图点击：添加或连线
    map.on('click', function(e){ const lng = e.lnglat.lng, lat = e.lnglat.lat; if(state.mode === 'add'){ addNode(lat, lng, nodeTypeEl.value, nodeNameEl.value.trim() || ''); } else if(state.mode === 'connect'){ if(!state.selectedNodeId){ alert('请先选中一个节点'); return; } if(!state.firstConnectNodeId){ state.firstConnectNodeId = state.selectedNodeId; alert('已选择第一个节点，点击第二个节点建立边'); return; } if(state.firstConnectNodeId === state.selectedNodeId){ alert('不能连接同一个节点'); return; } addEdge(state.firstConnectNodeId, state.selectedNodeId); state.firstConnectNodeId = null; alert('边已创建'); } });

    // 事件绑定
    document.getElementById('addModeBtn').addEventListener('click', ()=>setMode('add'));
    document.getElementById('connectModeBtn').addEventListener('click', ()=>setMode('connect'));
    document.getElementById('saveBtn').addEventListener('click', saveState);
    document.getElementById('exportBtn').addEventListener('click', exportJson);
    document.getElementById('resetBtn').addEventListener('click', resetAll);
    document.getElementById('attachHouseBtn').addEventListener('click', attachHouseToSelectedNode);
    document.getElementById('renameNodeBtn').addEventListener('click', renameSelectedNode);
    document.getElementById('deleteNodeBtn').addEventListener('click', deleteSelectedNode);
    imageInputEl.addEventListener('change', attachImageToSelectedNode);
    document.getElementById('importBtn').addEventListener('click', ()=>document.getElementById('importInput').click());
    document.getElementById('importInput').addEventListener('change', function(e){ const file = e.target.files[0]; if(file) importJson(file); e.target.value=''; });

    // 启动加载
    loadState(); setMode('add'); renderAll();

    // ---------- 定位修复实现 ----------
    function showDiag(msg){ diagEl.style.display='block'; diagText.textContent = msg; }
    function hideDiag(){ diagEl.style.display='none'; }

    // convert GPS (WGS84) to AMap (GCJ-02)
    function convertGpsToAmap(gpsLng, gpsLat, cb){
      if (typeof AMap.convertFrom === 'function'){
        // AMap.convertFrom accepts array of [lng,lat]
        AMap.convertFrom([[gpsLng,gpsLat]], 'gps', function(status, result){
          if (status === 'complete' && result && result.locations && result.locations.length){
            const loc = result.locations[0]; cb(null, { lng: loc.lng, lat: loc.lat });
          } else {
            cb(new Error('convertFrom failed: ' + JSON.stringify(result || status)));
          }
        });
      } else {
        // fallback: try plugin (older versions)
        try {
          AMap.plugin('AMap.Convertor', function(){
            if (typeof AMap.convertFrom === 'function'){
              AMap.convertFrom([[gpsLng,gpsLat]], 'gps', function(status, result){
                if (status === 'complete' && result && result.locations && result.locations.length){
                  const loc = result.locations[0]; cb(null, { lng: loc.lng, lat: loc.lat });
                } else cb(new Error('convertFrom failed'));
              });
            } else cb(new Error('convertFrom unavailable'));
          });
        } catch (e){ cb(new Error('convert plugin fail:' + e.message)); }
      }
    }

    function setCurrentLocationAmap(lng, lat, accuracyMeters){
      if (currentLocationMarker){ currentLocationMarker.setMap(null); currentLocationMarker = null; }
      if (currentLocationCircle){ currentLocationCircle.setMap(null); currentLocationCircle = null; }
      const html = `<div style="width:18px;height:18px;border-radius:50%;background:#007bff;border:2px solid rgba(255,255,255,0.9);box-shadow:0 1px 2px rgba(0,0,0,0.15)"></div>`;
      currentLocationMarker = new AMap.Marker({ position:[lng,lat], content:html, anchor:'center' });
      currentLocationMarker.setMap(map);
      if (typeof accuracyMeters === 'number'){
        currentLocationCircle = new AMap.Circle({ center:[lng,lat], radius: Math.max(5, Math.min(accuracyMeters, 200)), strokeColor:'#006cff', strokeOpacity:0.25, fillColor:'#bfe1ff', fillOpacity:0.12 });
        currentLocationCircle.setMap(map);
      }
      map.setCenter([lng, lat]);
    }

    function startBestPositionWatch({ maxSamples = 6, timeoutMs = 10000 } = {}){
      return new Promise((resolve) => {
        const samples = []; let finished = false; let watchId = null; let timeoutId = null;
        function finish(){ if (finished) return; finished = true; if (watchId !== null && navigator.geolocation && navigator.geolocation.clearWatch) navigator.geolocation.clearWatch(watchId); if (timeoutId) clearTimeout(timeoutId); if (samples.length === 0) return resolve({ err: new Error('no samples') }); samples.sort((a,b)=> (a.accuracy||99999)-(b.accuracy||99999)); return resolve({ best: samples[0], all: samples }); }
        if (navigator.geolocation && navigator.geolocation.watchPosition){
          try{
            watchId = navigator.geolocation.watchPosition(function(pos){ samples.push({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy, timestamp: pos.timestamp }); showDiag(`采样 ${samples.length}/${maxSamples}，当前精度 ${Math.round(pos.coords.accuracy||999)} m`); if (samples.length >= maxSamples || (pos.coords.accuracy && pos.coords.accuracy <= 12)) finish(); }, function(err){ console.warn('watchPosition error', err); }, { enableHighAccuracy: true, maximumAge: 0, timeout: timeoutMs });
          }catch(e){ console.warn('watchPosition not available', e); }
        }
        timeoutId = setTimeout(()=>{ finish(); }, timeoutMs + 200);
        if (!watchId && navigator.geolocation && navigator.geolocation.getCurrentPosition){
          navigator.geolocation.getCurrentPosition(function(pos){ samples.push({ lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy, timestamp: pos.timestamp }); finish(); }, function(err){ console.warn('getCurrentPosition err', err); }, { enableHighAccuracy: true, maximumAge: 0, timeout: timeoutMs });
        }
      });
    }

    async function locateAndShowBest(){
      showDiag('开始定位：采样中...');
      const res = await startBestPositionWatch({ maxSamples: 6, timeoutMs: 10000 });
      if (res.err || !res.best){
        showDiag('浏览器定位样本不足，尝试高德定位插件...');
        return new Promise((resolve)=>{
          try{
            AMap.plugin('AMap.Geolocation', function(){
              const geolocation = new AMap.Geolocation({ enableHighAccuracy: true, timeout: 8000, zoomToAccuracy: false });
              geolocation.getCurrentPosition(function(status, result){
                if (status === 'complete' && result && result.position){ const [lng, lat] = result.position; setCurrentLocationAmap(lng, lat, result.accuracy||undefined); showDiag(`高德定位成功，精度 ${result.accuracy||'N/A'} m`); resolve({ success:true, source:'amap-plugin', lng, lat, accuracy: result.accuracy }); }
                else { showDiag('高德定位失败'); resolve({ success:false, reason:'amap-failed', result }); }
              });
            });
          }catch(e){ showDiag('高德定位异常'); resolve({ success:false, reason:'amap-plugin-exception', err:e }); }
        });
      } else {
        const best = res.best; showDiag(`最佳样本精度 ${Math.round(best.accuracy||999)} m，正在转换坐标...`);
        return new Promise((resolve)=>{
          convertGpsToAmap(best.lng, best.lat, function(err, amapCoords){
            if (err){ showDiag('坐标转换失败，尝试高德定位插件'); console.warn('convertGpsToAmap err', err);
              try{ AMap.plugin('AMap.Geolocation', function(){ const geolocation = new AMap.Geolocation({ enableHighAccuracy:true, timeout:8000, zoomToAccuracy:false }); geolocation.getCurrentPosition(function(status,result){ if (status==='complete'&&result&&result.position){ const [lng,lat]=result.position; setCurrentLocationAmap(lng,lat,result.accuracy||undefined); showDiag(`高德定位成功，精度 ${result.accuracy||'N/A'} m`); resolve({ success:true, source:'amap-plugin', lng, lat, accuracy: result.accuracy }); } else { showDiag('高德定位失败'); resolve({ success:false }); } }); }); }catch(e){ showDiag('高德定位插件异常'); resolve({ success:false, err:e }); }
            } else {
              setCurrentLocationAmap(amapCoords.lng, amapCoords.lat, best.accuracy);
              showDiag(`定位成功（转换后），精度 ${Math.round(best.accuracy||999)} m`);
              resolve({ success:true, source:'gps-converted', lng: amapCoords.lng, lat: amapCoords.lat, accuracy: best.accuracy });
            }
          });
        });
      }
    }

    // 点击“定位并添加节点”按钮：使用改进的定位流程并添加节点（若成功）
    locateBtn.addEventListener('click', async () => {
      locateBtn.disabled = true; locateBtn.textContent = '定位中...';
      try{
        const r = await locateAndShowBest();
        if (r && r.success){
          // 已把蓝点显示在地图，转换回 node 所需的 lat/lng
          const lat = r.lat; const lng = r.lng; // note: these are AMap coords
          // 添加节点（类型按当前选择）
          addNode(lat, lng, nodeTypeEl.value, nodeNameEl.value.trim() || '');
          alert('已在当前位置添加一个节点，请检查并补充名称/门牌信息。');
        } else {
          alert('定位未成功，请到空旷处重试或使用地图手动添加节点。\n诊断信息：' + (r && r.reason ? r.reason : '未知'));
        }
      }finally{
        locateBtn.disabled = false; locateBtn.textContent = '定位并添加节点';
        setTimeout(()=>{ hideDiag(); }, 4000);
      }
    });

    // 页面加载时尝试居中地图（不会自动添加节点）
    (async function(){ try{ await locateAndShowBest(); setTimeout(()=>{ hideDiag(); }, 2000); } catch(e){ console.warn(e); hideDiag(); } })();

  </script>
</body>
</html>
